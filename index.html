<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Xitorque Accessories</title>
<style>
:root{--bg:#f4f6f5;--c:#fff;--t:#16201d;--m:#5d6b66;--a:#1d4ed8;--b:#dbe2df;--r:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1513;--c:#16201d;--t:#ecf2ef;--m:#93a39d;--a:#60a5fa;--b:#26332f;--r:#f97066}}
:root[data-theme=dark]{--bg:#0e1513;--c:#16201d;--t:#ecf2ef;--m:#93a39d;--a:#60a5fa;--b:#26332f;--r:#f97066}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:auto;padding:10px 12px 80px}

button,input,select{font:inherit;color:var(--t)}
button{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:8px 12px;white-space:nowrap;cursor:pointer}
button.on,button.p{background:var(--a);color:var(--bg);border-color:var(--a);font-weight:600}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);margin:3px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px;margin:6px 0}
.row img,.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--b);flex:none}
.g{flex:1;min-width:0}small{color:var(--m);display:block}
.pr{text-align:right}.big{font-size:18px;color:var(--a)}.r{color:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
#nav{position:sticky;top:env(safe-area-inset-top,0px);background:#1d4ed8;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;z-index:5;font-size:18px}
#nav .bg{background:none;border:0;color:#fff;font-size:26px;padding:0 6px;line-height:1}
#dw{display:none;position:fixed;inset:0;z-index:15}
#dw .sc{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#dw .pn{position:absolute;top:0;bottom:0;left:0;width:270px;max-width:80%;background:var(--c);padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#dw .ttl{background:#1d4ed8;color:#fff;padding:14px;border-radius:10px;font-size:17px;margin-bottom:4px}
#dw button{text-align:left;width:100%;font-size:16px;padding:11px 12px}
#dw button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.kp{border-radius:14px;padding:14px;color:#fff;margin:4px 0}.kp small{color:rgba(255,255,255,.85)}.kp b{font-size:20px}
#sp{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,#4c1d95,#1e1145 60%,#0b0720);transition:opacity .5s}
#sp .pic{position:absolute;top:0;left:0;right:0;height:36vh;background:center 20%/cover no-repeat;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.ci{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,#7c3aed 55%,#4c1d95);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(167,139,250,.22),0 0 55px #7c3aed;animation:pl 1.6s ease-in-out infinite}
.ci span{font:italic 800 44px/1 Georgia,'Times New Roman',serif;color:#fff;letter-spacing:2px;text-shadow:0 3px 12px rgba(0,0,0,.45)}
#sp p{position:absolute;bottom:calc(44px + env(safe-area-inset-bottom,0px));margin:0;color:#e9e3ff;letter-spacing:1px;font-size:14px}
#sp i{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:20%;right:20%;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#sp i:after{content:'';display:block;height:100%;background:#a78bfa;animation:ld 4s linear forwards}
@keyframes pl{50%{transform:scale(1.06)}}@keyframes ld{from{width:0}to{width:100%}}

<script>
const $=s=>document.querySelector(s),OW=['dash','prod','add','sales','khata','set'],TABS=[['dash','Dashboard','📊'],['prod','Mera Stock','📦'],['add','Add Product','➕'],['sales','Sales','🧾'],['khata','Khata','📒'],['shop','Shop Wale','🏪'],['cust','Customer','🛍️'],['set','Settings','⚙️']];
/* === APNI SETTINGS: PUB = licence PUBLIC key (JSON), GCID = Google OAuth Client ID === */
const PUB=null,GCID='';
let D={p:[],s:[],pay:[],pin:'',bk:0,lic:null,shop:'',seen:0},LK=false,LE='',TK=null,OP=null,V='dash',U=false,L=null,cart=[],mode='r',sel={},E=null,T=null,X=null,Q='',F=['','',''],C=null;
try{D=Object.assign(D,JSON.parse(localStorage.getItem('xt')||'{}'))}catch(e){}
try{const h=location.hash;if(h.startsWith('#c='))C=JSON.parse(decodeURIComponent(escape(atob(h.slice(3).replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){}
const sv=()=>{D.seen=Math.max(D.seen||0,Date.now());try{localStorage.setItem('xt',JSON.stringify(D))}catch(e){toast('Storage full! Backup lo')}if(TK&&Date.now()<TK.x){clearTimeout(sv.h);sv.h=setTimeout(()=>gup(true),3000)}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'Rs '+Math.round(+n||0).toLocaleString('en-US');
const sold=id=>D.s.reduce((a,s)=>a+s.it.filter(i=>i.id==id).reduce((b,i)=>b+i.q,0),0);
const left=p=>p.q-sold(p.id),ct=()=>cart.reduce((a,i)=>a+i.q*i.pr,0);
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2400)}
function khata(){const m={};D.s.filter(s=>s.m=='w').forEach(s=>{const k=s.shop.trim().toLowerCase(),o=m[k]=m[k]||{n:s.shop,ph:s.ph,b:0};o.b+=s.tot-s.adv;o.ph=s.ph||o.ph});D.pay.forEach(x=>{const o=m[x.shop.trim().toLowerCase()];if(o)o.b-=x.amt});return Object.values(m)}
function gate(){const v=$('#pin').value;if(!D.pin){if(v.length<4)return toast('Kam se kam 4 digit');D.pin=v;sv()}else if(v!==D.pin)return toast('Galat PIN');U=true;render()}
function unl(){if($('#lp').value!==D.pin)return toast('Galat PIN');L=null;U=true;render()}
function lock(m){if(!D.pin)return toast('Pehle PIN set karo');L=m;V=m;U=false;render()}
function pic(f){if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const mk=z=>{const s=Math.min(1,z/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',z>100?.6:.4)};T={img:mk(400),th:mk(64)};$('#pv').src=T.img;URL.revokeObjectURL(u)};im.src=u}
function saveP(){const g=i=>$('#f'+i).value.trim();if(!g('n'))return toast('Naam likho');const o={n:g('n'),c:g('c'),q:+g('q')||0,cost:+g('cost')||0,w:+g('w')||0,r:+g('r')||0,wr:g('wr')};let p=E&&D.p.find(x=>x.id==E);if(p)Object.assign(p,o);else{p={id:Date.now(),img:'',th:'',...o};D.p.push(p)}if(T){p.img=T.img;p.th=T.th}T=null;V=E?'prod':'add';E=null;sv();toast('Save ho gaya');render()}
function ed(id){E=id;T=null;V='add';render();scrollTo(0,0)}
function del(id){if(X!=id){X=id;return render()}D.p=D.p.filter(p=>p.id!=id);X=null;sv();render()}
function cp(t,m){const f=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();toast(m)};navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast(m),f):f()}
const pick=()=>{const l=D.p.filter(p=>sel[p.id]);if(!l.length)toast('Pehle products select karo');return l.length?l:null};
function lnk(m){const l=pick();if(!l)return;const ph=$('#ph').checked,d={m,t:D.shop,p:l.map(p=>[p.n,m=='s'?p.w:0,p.r,ph?p.th:'',p.c,wt(p.wr)=='No'?'':wt(p.wr)])},b=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_'),u=location.href.split('#')[0]+'#c='+b;cp(u,'Link copy hua ('+Math.round(u.length/1000)+' KB) — WhatsApp pe paste karo')}
function txt(m){const l=pick();if(!l)return;cp(l.map(p=>'• '+p.n+' — '+(m=='s'?'Wholesale '+R(p.w)+' | Retail ':'')+R(p.r)+(wt(p.wr)=='No'?'':' | Warranty: '+wt(p.wr))).join('\n'),'Text copy hua')}
function keep(){if(mode=='w'&&$('#ssh'))F=[$('#ssh').value,$('#sph').value,$('#sad').value]}
function pf(){const p=D.p.find(x=>x.id==$('#sp').value);$('#spr').value=p?(mode=='w'?p.w:p.r):''}
function bq(){$('#bq').textContent='Baqaya: '+R(ct()-(+$('#sad').value||0))}
function addC(){const p=D.p.find(x=>x.id==$('#sp').value);if(!p)return toast('Product chuno');const q=+$('#sq').value||1,pr=+$('#spr').value;if(!pr)return toast('Price likho');const inC=cart.filter(i=>i.id==p.id).reduce((a,i)=>a+i.q,0);if(q+inC>left(p))return toast('Sirf '+left(p)+' bachi hain');keep();cart.push({id:p.id,n:p.n,q,pr,cost:p.cost});render()}
function rm(i){keep();cart.splice(i,1);render()}
function bill(){if(!cart.length)return toast('Bill khali hai');keep();const t=ct(),s={id:Date.now(),t:Date.now(),m:mode,it:cart,tot:t,adv:t,shop:'',ph:''};if(mode=='w'){const sh=$('#ssh').value.trim();if(!sh)return toast('Shop ka naam likho');s.shop=sh;s.ph=$('#sph').value.trim();s.adv=Math.min(+$('#sad').value||0,t)}D.s.push(s);cart=[];F=['','',''];sv();toast('Bill save ho gaya');render()}
function delS(id){if(X!=id){X=id;return render()}D.s=D.s.filter(s=>s.id!=id);X=null;sv();render()}
function payR(i){const o=khata()[i],a=+$('#pa'+i).value;if(!o||!a)return toast('Amount likho');D.pay.push({shop:o.n,amt:a,t:Date.now()});sv();toast('Payment save ho gayi');render()}
async function bk(){const t=JSON.stringify(D);D.bk=Date.now();sv();try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'xitorque-backup.json',data:t});return render()}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='xitorque-backup.json';a.click();render()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{put(JSON.parse(r.result));toast('Restore ho gaya')}catch(e){toast('File sahi nahi hai')}};r.readAsText(f)}
function put(o){const l=D.lic,s=D.seen;D=Object.assign({p:[],s:[],pay:[],pin:'',bk:0},o);D.lic=l;D.seen=s;sv();render()}
const ub=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)),today=()=>new Date(Math.max(Date.now(),D.seen||0)).toISOString().slice(0,10);
async function lic(u,code){try{const[e,s]=code.trim().split('.'),k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,ub(s),new TextEncoder().encode(u.trim().toLowerCase()+'|'+e))&&e>=today()?e:''}catch(x){return ''}}
async function act(){const u=$('#lu').value,c=$('#lc').value,e=await lic(u,c);if(!e)return toast('Username ya code galat hai, ya expire ho gaya');D.lic={u:u.trim(),c:c.trim()};LE=e;LK=false;sv();render()}
async function boot(){setTimeout(()=>{const z=$('#sp');if(z){z.style.opacity=0;setTimeout(()=>z.remove(),500)}},C?0:4000);if(GCID){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';document.head.appendChild(s)}if(PUB&&!C){LE=D.lic?await lic(D.lic.u,D.lic.c):'';LK=!LE}render()}
function gtok(){return new Promise((ok,no)=>{if(TK&&Date.now()<TK.x)return ok(TK.t);if(!GCID||!window.google)return no('Drive setup nahi hai');google.accounts.oauth2.initTokenClient({client_id:GCID,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return no(r.error);TK={t:r.access_token,x:Date.now()+(r.expires_in-60)*1e3};ok(TK.t)}}).requestAccessToken()})}
async function gapi(u,o={}){const t=await gtok(),r=await fetch(u,{...o,headers:{...o.headers,Authorization:'Bearer '+t}});if(!r.ok)throw r.status;return r}
async function gid(){const r=await(await gapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='xitorque.json'"))).json();return r.files[0]&&r.files[0].id}
async function gup(q){try{const id=await gid(),b=JSON.stringify(D);if(id)await gapi('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:b});else await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary=xtb'},body:'--xtb\r\nContent-Type: application/json\r\n\r\n{"name":"xitorque.json","parents":["appDataFolder"]}\r\n--xtb\r\nContent-Type: application/json\r\n\r\n'+b+'\r\n--xtb--'});D.bk=Date.now();localStorage.setItem('xt',JSON.stringify(D));if(!q)toast('Drive pe save ho gaya')}catch(e){if(!q)toast('Drive error: '+e)}}
async function gdn(){if(X!=='gd'){X='gd';render();return toast('Dobara dabao: current data replace hoga')}X=null;try{const id=await gid();if(!id)return toast('Drive mein data nahi mila');put(await(await gapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json());toast('Drive se restore ho gaya')}catch(e){toast('Drive error: '+e)}}
async function shb(){const f=new File([JSON.stringify(D)],'xitorque-backup.txt',{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Xitorque Backup'});D.bk=Date.now();sv();render()}catch(e){}}else bk()}
const warn=()=>D.p.length>2&&Date.now()-D.bk>2592e5?`<div class="card r"><b>Data safe nahi hai!</b><small>Backup ${D.bk?Math.floor((Date.now()-D.bk)/864e5)+' din se purana hai':'abhi tak nahi liya'}. Browser saaf hua to sab data chala jayega.</small><button class="p" onclick="shb()">Abhi backup lo</button></div>`:'';
const setV=()=>`<div class="card"><b>Dukaan aur licence</b><input id="fs" placeholder="Dukaan ka naam" value="${esc(D.shop)}"><button onclick="D.shop=$('#fs').value.trim();sv();toast('Save ho gaya')">Naam save</button><small>${D.lic?'Licence: '+esc(D.lic.u)+' — '+LE+' tak':'Licence: free (owner copy)'}</small></div><div class="card"><b>Google Drive</b><small>${GCID?'Data apne Google Drive mein save/restore karo. Ek baar "Drive pe save" dabao, phir 1 ghante tak har save auto-sync hoga.':'Drive setup abhi nahi hua (GCID khali hai)'}</small>${GCID?`<div class="two"><button onclick="gup()">Drive pe save</button><button onclick="gdn()">${X==='gd'?'Pakka?':'Drive se restore'}</button></div>`:''}</div>`;
function zm(s){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px';d.innerHTML=`<img src="${s}" style="max-width:100%;max-height:100%;border-radius:10px">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const card=(x,m)=>`<div class="row">${x.img?`<img src="${x.img}" onclick="zm(this.src)">`:'<div class="ph"></div>'}<div class="g"><b>${esc(x.n)}</b>${x.wr===undefined?'':`<small>Warranty: <b style="color:${x.wr=='No'?'var(--m)':'var(--a)'}">${esc(x.wr)}</b></small>`}<small>${esc(x.c||'')}${x.st===0?' <span class="r">Out of stock</span>':m=='s'&&x.st?' · Stock '+x.st:''}</small></div><div class="pr">${m=='s'?`<small>Wholesale</small><b>${R(x.w)}</b><small>Retail</small>`:''}<b class="big">${R(x.r)}</b></div></div>`;
function src(){return C?C.p.map(a=>({n:a[0],w:a[1],r:a[2],img:a[3],c:a[4],wr:a[5]===undefined?undefined:(a[5]===1?'Yes':a[5]||'No')})):D.p.map(p=>({n:p.n,c:p.c,w:p.w,r:p.r,img:p.img,wr:wt(p.wr),st:left(p)}))}
function list(){const q=Q.toLowerCase(),m=C?C.m:V=='shop'?'s':'c';$('#lst').innerHTML=src().filter(x=>(x.n+' '+(x.c||'')).toLowerCase().includes(q)).map(x=>card(x,m)).join('')||'<div class="card">Koi product nahi mila</div>'}
const pubV=()=>`<h2 style="margin:6px 0">${esc((C?C.t:D.shop)||'Price List')}</h2><input id="q" placeholder="Search product ya category" value="${esc(Q)}" oninput="Q=this.value;list()"><div id="lst"></div>`;

function salesV(){return`<div class="two"><button class="${mode=='r'?'on':''}" onclick="keep();mode='r';render()">Retail</button><button class="${mode=='w'?'on':''}" onclick="keep();mode='w';render()">Wholesale</button></div>
<div class="card"><select id="sp" onchange="pf()"><option value="">Product chuno</option>${D.p.filter(p=>left(p)>0).map(p=>`<option value="${p.id}">${esc(p.n)} (bachi ${left(p)})</option>`).join('')}</select><div class="two"><input id="sq" type="number" value="1" placeholder="Qty"><input id="spr" type="number" placeholder="Price"></div><button class="p" onclick="addC()">+ Bill mein add karo</button></div>`+
cart.map((i,k)=>`<div class="row"><div class="g"><b>${esc(i.n)}</b><small>${i.q} × ${R(i.pr)}</small></div><b>${R(i.q*i.pr)}</b><button onclick="rm(${k})">✕</button></div>`).join('')+
`<div class="card"><b>Total ${R(ct())}</b>${mode=='w'?`<input id="ssh" placeholder="Shop ka naam" value="${esc(F[0])}"><input id="sph" type="tel" placeholder="Number" value="${esc(F[1])}"><input id="sad" type="number" placeholder="Advance payment" value="${esc(F[2])}" oninput="bq()"><b id="bq">Baqaya: ${R(ct()-(+F[2]||0))}</b>`:''}<button class="p" onclick="bill()">Bill save karo</button></div>
<b>Pichli sales</b>`+(D.s.slice(-10).reverse().map(s=>`<div class="row"><div class="g"><b>${s.m=='w'?esc(s.shop):'Retail'} · ${R(s.tot)}</b><small>${new Date(s.t).toLocaleDateString()} · ${esc(s.it.map(i=>i.n+' ×'+i.q).join(', '))}${s.m=='w'&&s.tot>s.adv?' · Advance '+R(s.adv):''}</small></div><button onclick="delS(${s.id})">${X==s.id?'Pakka?':'Cancel bill'}</button></div>`).join('')||'<div class="card">Abhi koi sale nahi.</div>')}
function khataV(){const k=khata().map((o,i)=>({...o,i})).filter(o=>o.b>0);return`<div class="card"><small>Kul baqaya</small><b class="big">${R(k.reduce((a,o)=>a+o.b,0))}</b></div>`+(k.map(o=>`<div class="card"><b>${esc(o.n)}</b><small>${o.ph?`<a href="tel:${esc(o.ph)}">${esc(o.ph)}</a>`:'Number nahi'}</small><b class="r">Baqaya ${R(o.b)}</b><div class="two"><input id="pa${o.i}" type="number" placeholder="Payment mili"><button class="p" onclick="payR(${o.i})">Payment save</button></div></div>`).join('')||'<div class="card">Koi udhaar baqi nahi.</div>')}
const wt=w=>w===true?'Yes':String(w||'').trim()||'No',dr=o=>$('#dw').style.display=o?'block':'none';
function dashV(){const inv=D.p.reduce((a,p)=>a+p.cost*p.q,0),sale=D.s.reduce((a,s)=>a+s.tot,0),pf=D.s.reduce((a,s)=>a+s.it.reduce((b,i)=>b+(i.pr-i.cost)*i.q,0),0),bqa=khata().reduce((a,k)=>a+k.b,0),td=D.s.filter(s=>new Date(s.t).toDateString()==new Date().toDateString()).reduce((a,s)=>a+s.tot,0),lo=D.p.filter(p=>left(p)<=2).slice(0,8),k=(t,v,c)=>`<div class="kp" style="background:${c}"><small>${t}</small><b>${R(v)}</b></div>`;
return`<h3 style="margin:4px 0 8px">Dashboard</h3><div class="two">${k('Kul investment',inv,'linear-gradient(135deg,#2563eb,#1e3a8a)')}${k('Kul sale',sale,'linear-gradient(135deg,#10b981,#047857)')}${k('Profit',pf,'linear-gradient(135deg,#8b5cf6,#5b21b6)')}${k('Baqaya (udhaar)',bqa,'linear-gradient(135deg,#f97316,#b45309)')}</div><div class="two"><div class="card"><small>Aaj ki sale</small><b>${R(td)}</b></div><div class="card"><small>Kul products</small><b>${D.p.length}</b></div></div><div class="card"><b>Kam stock (2 ya kam bachi)</b>${lo.map(p=>`<small>${esc(p.n)}: bachi ${left(p)}</small>`).join('')||'<small>Sab theek hai</small>'}</div>`}
function prodV(){return`<div class="card"><b>Share: products tick karo</b><label style="display:block"><input type="checkbox" id="ph" checked style="width:auto"> Link mein photo</label><div class="two"><button onclick="lnk('c')">Customer Link</button><button onclick="lnk('s')">Shop Link</button><button onclick="txt('c')">Customer Text</button><button onclick="txt('s')">Shop Text</button></div></div>`+(D.p.map(p=>`<div class="card" style="padding:8px"><div class="row" style="border:0;margin:0;padding:0" onclick="OP=OP==${p.id}?null:${p.id};render()"><input type="checkbox" style="width:auto" ${sel[p.id]?'checked':''} onclick="event.stopPropagation()" onchange="sel[${p.id}]=this.checked">${p.img?`<img src="${p.img}" onclick="event.stopPropagation();zm(this.src)">`:'<div class="ph"></div>'}<div class="g"><b>${esc(p.n)}</b><small>Warranty: <b>${esc(wt(p.wr))}</b></small></div><span>${OP==p.id?'▲':'▼'}</span></div>${OP==p.id?`<div style="margin-top:8px;border-top:1px solid var(--b);padding-top:8px"><small>Li ${p.q} · Bik ${sold(p.id)} · Bachi <b class="${left(p)<=2?'r':''}">${left(p)}</b></small><small>Cost ${R(p.cost)} (ek piece) · Wholesale ${R(p.w)} · Retail ${R(p.r)}</small><small>Profit per piece ${R(p.r-p.cost)}${p.c?' · '+esc(p.c):''}</small><div class="two" style="margin-top:6px"><button onclick="ed(${p.id})">Edit</button><button onclick="del(${p.id})">${X==p.id?'Pakka?':'Delete'}</button></div></div>`:''}</div>`).join('')||'<div class="card">Abhi koi product nahi. Add Product tab se add karo.</div>')}
function addV(){const e=E&&D.p.find(x=>x.id==E)||{},f=(id,l,v)=>`<div><small>${l}</small><input id="${id}" type="number" value="${v??''}"></div>`;
return`<div class="card"><b>${E?'Product edit karo':'Naya product'}</b><input id="fn" placeholder="Product ka naam" value="${esc(e.n)}"><input id="fc" placeholder="Category (charger, cable...)" value="${esc(e.c)}"><div class="two">${f('fq','Kitne piece li (quantity)',e.q)}${f('fcost','Ek piece ki cost (jis rate pe khareedi)',e.cost)}${f('fw','Wholesale price (ek piece)',e.w)}${f('fr','Retail price (ek piece)',e.r)}</div><small>Warranty: nahi hai to khali chhodo, hai to likho (jaise 6 mahine)</small><input id="fwr" placeholder="Warranty nahi" value="${esc(e.wr===true?'Yes':e.wr)}"><small>Photo</small><input type="file" accept="image/*" onchange="pic(this.files[0])"><img id="pv" width="72" ${e.img?`src="${e.img}"`:''}><div class="two"><button class="p" onclick="saveP()">${E?'Save':'Save & next'}</button>${E?'<button onclick="E=null;V=\'prod\';render()">Cancel</button>':''}</div></div>`}
const setTabV=()=>`<h3 style="margin:4px 0 8px">Settings</h3>`+setV()+`<div class="card"><b>Backup</b><small>Data sirf isi phone/browser mein hai. Hafte mein ek baar backup lo.</small><div class="two"><button onclick="shb()">Backup bhejo / save</button><input type="file" accept=".json,.txt,text/plain" onchange="rs(this.files[0])"></div></div>`;
function render(){const a=$('#app'),n=$('#nav'),hb=b=>{n.innerHTML=(b?'<button class="bg" onclick="dr(1)">☰</button>':'')+'<b>XiTorque Khata</b>'};
if(C){hb(0);a.innerHTML=pubV();return list()}
if(LK){hb(0);a.innerHTML=`<div class="card"><b>Licence chahiye</b><small>${D.lic?'Aapka licence expire ho gaya. Naya code lo.':'Apna username aur code daalo.'}</small><input id="lu" placeholder="Username" value="${esc(D.lic?D.lic.u:'')}"><input id="lc" placeholder="Code"><button class="p" onclick="act()">Activate</button></div>`;return}
if(L){hb(0);a.innerHTML=pubV()+`<div class="card"><small>Unlock ke liye PIN</small><div class="two"><input id="lp" type="password" inputmode="numeric" placeholder="PIN"><button onclick="unl()">Unlock</button></div></div>`;return list()}
hb(1);$('#dw').innerHTML='<div class="sc" onclick="dr(0)"></div><div class="pn"><b class="ttl">XiTorque Khata</b>'+TABS.map(([k,t,i])=>`<button class="${V==k?'on':''}" onclick="V='${k}';dr(0);render()">${i} ${t}</button>`).join('')+(U?'<button onclick="dr(0);lock(\'shop\')">🔒 Shop mode</button><button onclick="dr(0);lock(\'cust\')">🔒 Customer mode</button>':'')+'</div>';
if(OW.includes(V)&&!U){a.innerHTML=`<div class="card"><b>${D.pin?'PIN daalo':'Naya PIN set karo (4+ digit)'}</b><input id="pin" type="password" inputmode="numeric"><button class="p" onclick="gate()">OK</button></div>`;return}
a.innerHTML=(OW.includes(V)?warn():'')+({dash:dashV,prod:prodV,add:addV,sales:salesV,khata:khataV,set:setTabV,shop:pubV,cust:pubV}[V])();if(V=='shop'||V=='cust')list()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
boot();
</script></body></html>
