<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XiTorque Khata</title><meta name="theme-color" content="#1d4ed8"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f5;--c:#fff;--t:#16201d;--m:#5d6b66;--a:#1d4ed8;--b:#dbe2df;--r:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1513;--c:#16201d;--t:#ecf2ef;--m:#93a39d;--a:#60a5fa;--b:#26332f;--r:#f97066}}
:root[data-theme=dark]{--bg:#0e1513;--c:#16201d;--t:#ecf2ef;--m:#93a39d;--a:#60a5fa;--b:#26332f;--r:#f97066}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:auto;padding:10px 12px 80px}

button,input,select{font:inherit;color:var(--t)}
button{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:8px 12px;white-space:nowrap;cursor:pointer}
button.on,button.p{background:var(--a);color:var(--bg);border-color:var(--a);font-weight:600}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);margin:3px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px;margin:6px 0}
.row img,.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--b);flex:none}
.g{flex:1;min-width:0}small{color:var(--m);display:block}
.pr{text-align:right}.big{font-size:18px;color:var(--a)}.r{color:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
#nav{position:sticky;top:env(safe-area-inset-top,0px);background:#1d4ed8;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;z-index:5;font-size:18px}
#nav .bg{background:none;border:0;color:#fff;font-size:26px;padding:0 6px;line-height:1}
#dw{display:none;position:fixed;inset:0;z-index:15}
#dw .sc{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#dw .pn{position:absolute;top:0;bottom:0;left:0;width:270px;max-width:80%;background:var(--c);padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#dw .ttl{background:#1d4ed8;color:#fff;padding:14px;border-radius:10px;font-size:17px;margin-bottom:4px}
#dw button{text-align:left;width:100%;font-size:16px;padding:11px 12px}
#dw button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.kp{border-radius:14px;padding:14px;color:#fff;margin:4px 0}.kp small{color:rgba(255,255,255,.85)}.kp b{font-size:20px}


.ci{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,#7c3aed 55%,#4c1d95);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(167,139,250,.22),0 0 55px #7c3aed;animation:pl 1.6s ease-in-out infinite}
.ci span{font:italic 800 44px/1 Georgia,'Times New Roman',serif;color:#fff;letter-spacing:2px;text-shadow:0 3px 12px rgba(0,0,0,.45)}



@keyframes pl{50%{transform:scale(1.06)}}@keyframes ld{from{width:0}to{width:100%}}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d12;transition:opacity .5s}
#splash img{width:min(80vw,calc(40vh*1.46));border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#splash .ci{margin:8px 0 2px}
#splash p{margin:0;color:#e5e7eb;letter-spacing:1px;font-size:15px}
#splash i{width:min(60vw,260px);height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#splash i:after{content:'';display:block;height:100%;background:#a78bfa;animation:ld 4s linear forwards}
#pf{display:none;position:fixed;inset:0;z-index:15}
#pf .sc{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pf .pn{position:absolute;top:0;bottom:0;right:0;width:280px;max-width:82%;background:var(--c);padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#pf .ttl{background:#1d4ed8;color:#fff;padding:14px;border-radius:10px;font-size:17px}
#pf button{text-align:left;width:100%;font-size:16px;padding:11px 12px}
#nav .pf{margin-left:auto;width:36px;height:36px;border-radius:50%;padding:0;border:2px solid #fff;background:#3b82f6;color:#fff;font-size:16px;font-weight:700;overflow:hidden;display:flex;align-items:center;justify-content:center}
#nav .pf img{width:100%;height:100%;object-fit:cover}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px}.sub button{flex:none}
#ob{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;z-index:9}.qb{display:flex;align-items:center;gap:6px}.qb b{min-width:22px;text-align:center}@media print{#nav,button,#ob,.noprint{display:none!important}}
.bb{font-size:17px;padding:18px 8px;border-radius:14px;margin:3px 0}
