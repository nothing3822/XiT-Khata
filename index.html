<style>
:root{--bg:#F4F6F8;--c:#fff;--t:#0F172A;--m:#64748B;--a:#0F172A;--b:#E2E8F0;--r:#DC2626;--ok:#059669;--w:#B45309;--hd:#0F172A;--sf:#F8FAFC;--tn:rgba(15,23,42,.07);--gd:#C9A44C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1120;--c:#131C2E;--t:#E5E7EB;--m:#94A3B8;--a:#E2E8F0;--b:#243045;--r:#F87171;--ok:#34D399;--w:#FBBF24;--hd:#0B1120;--sf:#0F1729;--tn:rgba(226,232,240,.08)}}
:root[data-theme=dark]{--bg:#0B1120;--c:#131C2E;--t:#E5E7EB;--m:#94A3B8;--a:#E2E8F0;--b:#243045;--r:#F87171;--ok:#34D399;--w:#FBBF24;--hd:#0B1120;--sf:#0F1729;--tn:rgba(226,232,240,.08)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{max-width:680px;margin:auto;padding:12px 14px calc(92px + env(safe-area-inset-bottom,0px))}
h3{font-weight:700;letter-spacing:-.01em;font-size:19px}b{font-weight:600}
button,input,select,textarea{font:inherit;color:var(--t)}
button{border:1px solid var(--b);background:var(--c);border-radius:10px;padding:9px 14px;white-space:nowrap;cursor:pointer;font-weight:500;transition:background-color .15s,border-color .15s,transform .1s}
button:active{transform:scale(.98)}
button.on,button.p{background:var(--a);color:var(--c);border-color:var(--a);font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);margin:3px 0;outline:0;transition:border-color .15s,box-shadow .15s}

.row{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:8px 10px;margin:6px 0}
.row img,.ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--tn);flex:none}
.g{flex:1;min-width:0}small{color:var(--m);display:block}
.pr{text-align:right}.big{font-size:18px;color:var(--t);font-weight:700}.r{color:var(--r)}.ok{color:var(--ok)}.w{color:var(--w)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}

.brand{display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.02em}.brand b{font-weight:700}
.lg{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1E293B,#0F172A);border:1.5px solid var(--gd);color:var(--gd);font:700 17px/1 Georgia,serif;display:flex;align-items:center;justify-content:center;flex:none}

#nav .pf{margin-left:auto;width:36px;height:36px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.22);background:#1E293B;color:#fff;font-size:15px;font-weight:700;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
#nav .pf img{width:100%;height:100%;object-fit:cover}
.sub{display:flex;gap:4px;overflow-x:auto;margin:0 0 10px;padding:4px;background:var(--c);border:1px solid var(--b);border-radius:12px;scrollbar-width:none}.sub::-webkit-scrollbar{display:none}

#tb button.on{color:var(--t);font-weight:700}#tb button.on .ib{background:var(--tn)}#tb button.on .ic{stroke-width:2.2}
.bd{position:absolute;top:0;left:calc(50% + 6px);background:var(--r);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;border-radius:9px;padding:0 4px;text-align:center}

.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.lr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px}
#sb{display:none}

#pf .ttl{background:var(--hd);color:#fff;padding:14px;border-radius:12px;font-size:17px}
#pf button{text-align:left;width:100%;font-size:15px;padding:11px 12px}
.kp{border-radius:14px;padding:14px;color:#fff;margin:4px 0}.kp small{color:rgba(255,255,255,.8)}.kp b{font-size:20px;font-weight:700}
#ob{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;z-index:9}.qb{display:flex;align-items:center;gap:6px}.qb b{min-width:22px;text-align:center}@media print{#nav,#tb,#sb,button,#ob,.noprint{display:none!important}body.hs main{margin-left:auto!important}}
.bb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;padding:16px 8px;border-radius:14px;margin:0}.bb .ic{width:24px;height:24px}
.ti{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0;white-space:normal}.ti span{display:flex;align-items:center;gap:10px}
@media(min-width:900px){
body.hs main{margin-left:calc(240px + max(16px,(100vw - 240px - 680px)/2))}body.hs #tb{display:none}
body.hs #sb{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;width:240px;background:var(--c);border-right:1px solid var(--b);padding:12px 10px;overflow-y:auto;z-index:6}

main{padding-bottom:40px}#toast{bottom:24px}}

.hi{margin:4px 2px 12px}.hi h3{margin:2px 0 0;font-size:21px}

.hero{background:linear-gradient(135deg,#0F172A,#1E293B);color:#fff;border-radius:18px;padding:18px;margin:10px 0;border:1px solid rgba(201,164,76,.35);box-shadow:0 8px 24px rgba(15,23,42,.18)}
.hero small{color:#94A3B8}.hero>b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;font-variant-numeric:tabular-nums}.hero>b.neg{color:#FCA5A5}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}.hg b{display:block;font-size:15px;font-variant-numeric:tabular-nums}

.stc{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px 14px;min-width:0}.stc b{display:block;font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}

.ls{margin-top:6px}.ls .kv+.kv{border-top:1px solid var(--b)}.ls .kv small{display:inline}
.seg{display:flex;gap:2px;padding:3px;background:var(--tn);border-radius:10px}.seg button{border:0;background:none;padding:5px 10px;font-size:12px;border-radius:8px;color:var(--m)}.seg button.on{background:var(--c);color:var(--t);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sub.eq button{flex:1}
.gr{display:block;width:100%;height:120px;margin-top:8px}.gr .bn{fill:var(--t);opacity:.85}.gr .bt{fill:var(--gd)}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--m);margin-top:4px}.gl.g7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.chv{color:var(--m);display:flex}.chv .ic{transition:transform .2s}.chv.up .ic{transform:rotate(180deg)}
a[href^="tel:"]{color:var(--t);font-weight:500}.wl{display:inline-flex;align-items:center;gap:6px;margin:6px 0;font-weight:600;text-decoration:none;color:var(--ok)}
.cd{font-size:12px;color:var(--m);margin-left:4px}

.es{text-align:center;padding:28px 16px}.es>.ic{width:46px;height:46px;padding:11px;border-radius:14px;background:var(--tn);color:var(--m);display:block;margin:0 auto 10px}.es>b{display:block;font-size:16px}.es>small{margin-top:4px}.es>button{margin-top:14px}
.lg svg{width:20px;height:20px;fill:currentColor}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
@keyframes sl{from{transform:translateX(100%)}to{transform:none}}
main.an{animation:fu .22s ease-out}
#dw .sc,#pf .sc{animation:fi .2s ease-out}
#dw .pn{animation:su .25s cubic-bezier(.2,.8,.2,1)}
#pf .pn{animation:sl .25s cubic-bezier(.2,.8,.2,1)}
.hero,.qa button,.stc{transition:transform .15s}
.qa button:active,.tl:active{transform:scale(.96)}
main.an .gr rect{transform-origin:bottom;transform-box:fill-box;animation:gb .4s ease-out backwards}
@keyframes gb{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){main,main *,#dw *,#pf *,#tb *,#sb *,#toast{animation:none!important;transition:none!important}}

body.og #nav{display:none}
.ob{max-width:440px;margin:0 auto;padding:28px 4px 20px}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;font-weight:600}.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--m);font-size:12px;margin:12px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--b)}
.lk2{background:none;border:0;color:var(--t);text-decoration:underline;padding:6px 0;font-weight:500}
.pl{position:relative;border-width:1.5px}.pl.cur{border-color:var(--t)}.pl h4{margin:0;font-size:18px}.pl .pp{font-size:24px;font-weight:800;margin:4px 0 8px}.pl .pp small{display:inline;font-size:13px;font-weight:500}

.dg{color:var(--r);border-color:rgba(220,38,38,.35)}
