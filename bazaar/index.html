</style></head>

let PQ0='';function rq(){clearTimeout(rq.t);rq.t=setTimeout(()=>{const L=SHOPS||[];const e=$('#res');if(!e)return;const words=Q.toLowerCase().split(/\s+/).filter(Boolean);let F=L.filter(s=>(!CITY||(s.city||'').trim()==CITY)&&(!BT||s.bt==BT)),PM=[];if(words.length){PM=F.map(s=>{const hits=String(s.kw||'').split('|').filter(n=>words.every(w=>n.includes(w)));const nameHit=words.every(w=>(String(s.n)+' '+(s.bt||'')+' '+(s.city||'')).toLowerCase().includes(w));return{s,hits,nameHit}}).filter(x=>x.hits.length||x.nameHit).sort((a,b)=>b.hits.length-a.hits.length);F=PM.map(x=>x.s)}e.innerHTML=resV(F,PM,words,L.filter(s=>FAV.includes(s.id)))},150)}
const es=(i,t,x)=>`<div class="card es">${ic(i)}<b>${t}</b>${x?'<small style="margin-top:4px">'+x+'</small>':''}</div>`;

function shopV(){const s=SH[SID]||(SHOPS||[]).find(x=>x.id==SID);if(!s)return skel(1)+'<div class="grid">'+'<div class="sk" style="height:230px"></div>'.repeat(4)+'</div>';if(s.err&&!ITEMS[SID])return es('store','Dukaan load nahi hui','<button onclick="loadShop(SID)">Dobara koshish</button>');if(s.gone||s.live===false)return es('store','Ye dukaan abhi Bazaar par nahi hai','<button onclick="go(\'home\')">Doosri dukaanen dekhein</button>');
if(PQ0){PQ=PQ0;PQ0=''}const L=ITEMS[SID],cats=[...new Set((L||[]).map(p=>p.c).filter(Boolean))].sort(),w=PQ.toLowerCase().split(/\s+/).filter(Boolean),V=(L||[]).filter(p=>(!PCAT||p.c==PCAT)&&w.every(x=>(p.n+' '+(p.c||'')).toLowerCase().includes(x))),fv=FAV.includes(SID),url=location.origin+location.pathname+'?s='+SID;
return`<button onclick="history.length>1?history.back():go('home')" style="border:0;background:none;padding:4px 0;margin-bottom:4px;color:var(--m)">${ic('back')} Wapas</button>
<div class="hdr"><div class="shp">${av(s)}<div class="g"><b>${esc(s.n)}</b><small>${esc([s.bt,s.city].filter(Boolean).join(' · '))}</small></div></div>${s.ds?`<small style="margin-top:10px">${esc(s.ds)}</small>`:''}<div class="tags">${s.dl?`<span class="tag ok">${ic('truck')} ${esc(s.dl)}</span>`:''}${s.ad?`<span class="tag" style="background:rgba(255,255,255,.08);color:#CBD5E1">${ic('pin')} ${esc(s.ad)}</span>`:''}</div>
<div class="acts">${s.ph?`<a href="tel:${dg(s.ph)}">${ic('phone')}Call</a><a href="https://wa.me/${wan(s.ph)}?text=${encodeURIComponent('Assalam o Alaikum, Tijarat Bazaar se aap ki dukaan dekhi.')}" target="_blank" rel="noopener">${ic('wa')}WhatsApp</a>`:'<span></span><span></span>'}<button onclick="shareShop()">${ic('share')}Share</button><button class="${fv?'on':''}" onclick="favT()">${ic('heart')}${fv?'Saved':'Save'}</button></div></div>
<div class="srch" style="margin-top:4px">${ic('search')}<input placeholder="Is dukaan mein dhoondein…" value="${esc(PQ)}" oninput="PQ=this.value;rp()"></div>
${cats.length>1?`<div class="chips">${['',...cats].map(c=>`<button class="${PCAT==c?'on':''}" onclick="PCAT=this.dataset.c;render()" data-c="${esc(c)}">${c?esc(c):'Sab'}</button>`).join('')}</div>`:''}
<div id="pl">${plV(L,V)}</div>`}
function plV(L,V){if(!L)return'<div class="grid">'+'<div class="sk" style="height:230px"></div>'.repeat(4)+'</div>';if(!V.length)return es('box',L.length?'Kuch nahi mila':'Abhi koi product nahi',L.length?'Doosra naam likh kar dhoondein':'');return`<div class="grid">${V.map(pCard).join('')}</div>`}
function rp(){clearTimeout(rp.t);rp.t=setTimeout(()=>{const L=ITEMS[SID],w=PQ.toLowerCase().split(/\s+/).filter(Boolean),V=(L||[]).filter(p=>(!PCAT||p.c==PCAT)&&w.every(x=>(p.n+' '+(p.c||'')).toLowerCase().includes(x)));const e=$('#pl');if(e)e.innerHTML=plV(L,V)},120)}
const inC=id=>CART.s==SID?(CART.it[id]||{}).q||0:0;
function pCard(p){const q=inC(p.id),av=p.q>0,th=img(p.th);return`<div class="pc"><div class="im" onclick="pOpen('${esc(p.id)}')">${th?`<img src="${th}" alt="" loading="lazy">`:ic('box')}</div><div class="in"><div class="nm" onclick="pOpen('${esc(p.id)}')">${esc(p.n)}</div><div class="pr">${R(p.r)}</div><div class="st ${av?'ok':'no'}">${av?(SH[SID]&&SH[SID].sq?p.q+' mojood':'Stock mein'):'Stock khatam'}</div>${q?`<div class="qb"><button onclick="cq('${esc(p.id)}',-1)">−</button><b>${q}</b><button onclick="cq('${esc(p.id)}',1)">+</button></div>`:`<button class="add" ${av?'':'disabled'} onclick="cq('${esc(p.id)}',1)">Cart mein daalein</button>`}</div></div>`}

/* ---------- product sheet ---------- */
async function pOpen(id){const p=(ITEMS[SID]||[]).find(x=>x.id==id);if(!p)return;const th=img(p.th);sheet(`<div class="hdl"></div><div class="big" id="bim">${th?`<img src="${th}" style="width:100%;height:100%;object-fit:contain;border-radius:14px;filter:blur(2px)">`:ic('box')}</div><h3 style="margin:12px 0 4px">${esc(p.n)}</h3><div class="pr" style="font-size:22px">${R(p.r)}</div><div class="mt">${p.c?`<small>Category: ${esc(p.c)}</small>`:''}${p.wr?`<small>Warranty: <b>${esc(p.wr)}</b></small>`:''}<small class="st ${p.q>0?'ok':'no'}">${p.q>0?'Stock mein':'Stock khatam'}</small></div><button class="p" style="width:100%;padding:12px" ${p.q>0?'':'disabled'} onclick="cq('${esc(p.id)}',1);shut();toast('Cart mein aa gaya')">Cart mein daalein</button>`);
try{const{F,db}=await fs(),d=await F.getDoc(F.doc(db,'shops',SID,'img',id)),u=d.exists()?img(d.data().d):'';const e=$('#bim');if(u&&e)e.innerHTML=`<img src="${u}" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:14px">`;else if(e&&th)e.querySelector('img').style.filter=''}catch(e){}}
function sheet(h){$('#shp').innerHTML=h;if($('#sh').style.display=='block')return;$('#sh').style.display='block';try{history.pushState({p:PG,id:SID,sh:1},'')}catch(e){}}
function shut(){if($('#sh').style.display!='block')return;$('#sh').style.display='none';if(history.state&&history.state.sh)try{history.back()}catch(e){}}

/* ---------- cart ---------- */
function cq(id,d){if(CART.s&&CART.s!=SID&&Object.keys(CART.it).length){if(!confirm2())return}if(CART.s!=SID)CART={s:SID,it:{}};const p=(ITEMS[SID]||[]).find(x=>x.id==id);if(!p)return;const c=CART.it[id]||{n:p.n,r:p.r,q:0};c.q=Math.max(0,c.q+d);c.r=p.r;c.n=p.n;if(c.q)CART.it[id]=c;else delete CART.it[id];if(!Object.keys(CART.it).length)CART={s:null,it:{}};LS.set('cart',CART);const e=$('#pl');if(e&&PG=='shop')rp();bar()}
let CF2=0;function confirm2(){if(CF2){CF2=0;return true}CF2=1;toast('Cart mein doosri dukaan ka saman hai. Dobara dabayein to purana cart khaali ho jayega');setTimeout(()=>CF2=0,4000);return false}
const ctot=()=>Object.values(CART.it).reduce((a,i)=>a+i.q*i.r,0),ccnt=()=>Object.values(CART.it).reduce((a,i)=>a+i.q,0);
function bar(){const b=$('#bar'),n=ccnt();if(!n||PG=='orders'){b.style.display='none';return}const s=SH[CART.s]||(SHOPS||[]).find(x=>x.id==CART.s)||{};b.style.display='block';b.innerHTML=`<div class="w"><div><b>${n} items · ${R(ctot())}</b><small>${esc(s.n||'')}</small></div><button class="p" onclick="cartV()">${ic('bag')} Cart dekhein</button></div>`}
function cartV(){const s=SH[CART.s]||(SHOPS||[]).find(x=>x.id==CART.s)||{};sheet(`<div class="hdl"></div><h3>Aap ka cart</h3><small>${esc(s.n||'')}</small><div class="card">${Object.entries(CART.it).map(([id,i])=>`<div class="kv"><span style="min-width:0"><b style="display:block">${esc(i.n)}</b><small>${R(i.r)} × ${i.q}</small></span><span class="qb" style="margin:0"><button onclick="SID='${esc(CART.s)}';cq('${esc(id)}',-1);cartV()">−</button><b>${i.q}</b><button onclick="SID='${esc(CART.s)}';cq('${esc(id)}',1);cartV()">+</button></span></div>`).join('')}<div class="kv"><b>Total</b><b class="pr">${R(ctot())}</b></div></div>
<div class="card"><b>Aap ki maloomat</b><small>Dukaan wala isi par rabta karega</small><input id="c1" placeholder="Aap ka naam" value="${esc(ME.nm||'')}" autocomplete="name"><input id="c2" type="tel" placeholder="Phone number" value="${esc(ME.ph||'')}" autocomplete="tel"><input id="c3" placeholder="Address (ghar / dukaan ka pata)" value="${esc(ME.ad||'')}" autocomplete="street-address"><input id="c4" placeholder="Note (optional)" maxlength="200"></div>
<button class="p" id="cbtn" style="width:100%;padding:13px;font-size:16px" onclick="place()">Order bhejein · ${R(ctot())}</button><small style="text-align:center;margin-top:8px">Payment dukaan wale se baat karke. Order confirm hone par wo aap se rabta karega.</small>`);if(!ccnt())shut()}
async function place(){const nm=$('#c1').value.trim(),ph=$('#c2').value.trim(),ad=$('#c3').value.trim(),nt=$('#c4').value.trim();if(nm.length<2||dg(ph).length<10)return toast('Naam aur sahi phone number likhein');if(ad.length<5)return toast('Address likhein');const sid=CART.s,it=Object.entries(CART.it).map(([id,i])=>({i:isNaN(+id)?id:+id,n:String(i.n).slice(0,120),q:i.q,pr:i.r}));if(!it.length)return;if(it.length>60)return toast('Ek order mein 60 se zyada cheezen nahi');ME={nm,ph,ad};LS.set('me',ME);const b=$('#cbtn');b.disabled=true;b.textContent='Bheja ja raha hai…';
const no='BZ-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join(''),o={o:sid,cid:'bz_'+sid,no,nm:nm.slice(0,80),ph:ph.slice(0,25),ad:ad.slice(0,300),nt:('[Tijarat Bazaar] '+nt).slice(0,300),m:'c',it,tot:it.reduce((a,i)=>a+i.q*i.pr,0),st:'new',t:Date.now()};
try{const{F,db}=await fs();await F.setDoc(F.doc(db,'orders',no),o);const s=SH[sid]||{};ORD.unshift({id:no,s:sid,sn:s.n||'',ph:s.ph||'',it,tot:o.tot,t:o.t});LS.set('orders',ORD.slice(0,50));OST[no]={st:'new'};CART={s:null,it:{}};LS.set('cart',CART);bar();
sheet(`<div class="hdl"></div><div class="es" style="padding-top:10px">${ic('check','ok2')}<h3>Order chala gaya!</h3><small style="margin:6px 0">Order number: <b>${no}</b></small><small>${esc(s.n||'Dukaan')} aap ka order dekh kar confirm karega aur aap se rabta karega.</small></div>${s.ph?`<a class="card" style="display:flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;color:var(--ok);font-weight:600" target="_blank" rel="noopener" href="https://wa.me/${wan(s.ph)}?text=${encodeURIComponent('Assalam o Alaikum, maine Tijarat Bazaar se order kiya hai.\nOrder: '+no+'\n'+it.map(i=>i.n+' x'+i.q).join('\n')+'\nTotal: '+R(o.tot)+'\n'+nm+' '+ph)}">${ic('wa')} WhatsApp par dukaan ko batayein</a>`:''}<button style="width:100%" onclick="shutTo('orders')">Mere orders dekhein</button>`)}catch(e){b.disabled=false;b.textContent='Dobara koshish karein';toast('Order nahi gaya: '+(e.code=='permission-denied'?'ye dukaan abhi order nahi le rahi':(e.code||e.message)))}}

/* ---------- orders ---------- */
async function trackAll(){try{const{F,db}=await fs();await Promise.all(ORD.slice(0,20).map(async o=>{try{const d=await F.getDoc(F.doc(db,'orders',o.id));OST[o.id]=d.exists()?{st:d.data().st,it:d.data().it,tot:d.data().tot,ed:d.data().ed}:{st:'gone'}}catch(e){}}))}catch(e){}if(PG=='orders')render()}
const SL={new:['new','Confirm ka intezar',1],ready:['ready','Tayyar / bhej diya',2],delivered:['delivered','Deliver ho gaya',3],cancel:['cancel','Cancel ho gaya',0],gone:['cancel','Nahi mila',0]};
function ordersV(){if(!ORD.length)return`<h3 style="margin:6px 0">Mere orders</h3>`+es('bag','Abhi koi order nahi','Kisi dukaan se saman cart mein daal kar order karein')+'<button class="p" style="width:100%" onclick="go(\'home\')">Dukaanen dekhein</button>';
return`<div class="sec" style="margin-top:6px"><h3>Mere orders</h3><button onclick="trackAll();toast('Status check ho raha hai')" style="padding:6px 10px">${ic('refresh')}</button></div>`+ORD.map(o=>{const x=OST[o.id],l=x?SL[x.st]||SL.new:null,it=(x&&x.it)||o.it,tot=(x&&x.tot)||o.tot;return`<div class="card"><div class="kv" style="padding-top:0"><b>${esc(o.sn||'Dukaan')}</b>${l?`<span class="ost ${l[0]}">${l[1]}</span>`:'<small>…</small>'}</div><small>${esc(o.id)} · ${new Date(o.t).toLocaleDateString('en-GB')}</small>${l&&l[2]?`<div class="tl">${[1,2,3].map(i=>`<i class="${i<=l[2]?'on':''}"></i>`).join('')}</div>`:''}<small style="margin-top:6px">${esc(it.filter(i=>!i.rm).map(i=>i.n+' ×'+i.q).join(', '))}</small><div class="kv"><span>${x&&x.ed?'<small>Dukaan ne order badla</small>':''}</span><b class="pr">${R(tot)}</b></div>${o.ph?`<div style="display:flex;gap:6px"><a href="tel:${dg(o.ph)}" style="flex:1"><button style="width:100%">${ic('phone')} Call</button></a><a href="https://wa.me/${wan(o.ph)}?text=${encodeURIComponent('Assalam o Alaikum, mera order '+o.id+' ka status?')}" target="_blank" rel="noopener" style="flex:1"><button style="width:100%">${ic('wa')} WhatsApp</button></a></div>`:''}</div>`}).join('')}

/* ---------- misc ---------- */
function favT(){FAV=FAV.includes(SID)?FAV.filter(x=>x!=SID):[SID,...FAV];LS.set('fav',FAV);render();toast(FAV.includes(SID)?'Dukaan save ho gayi':'Save se hata di')}
async function shareShop(){const s=SH[SID]||{},u=location.origin+location.pathname+'?s='+SID,t=(s.n||'Dukaan')+' — Tijarat Bazaar par dekhein';try{if(navigator.share)return await navigator.share({title:t,text:t,url:u})}catch(e){if(e.name=='AbortError')return}try{await navigator.clipboard.writeText(t+'\n'+u);toast('Link copy ho gaya')}catch(e){toast(u)}}

/* ---------- boot ---------- */
(function(){const q=new URLSearchParams(location.search),s=q.get('s');if(s&&/^[A-Za-z0-9]{6,40}$/.test(s)){PG='shop';SID=s;loadShop(s)}else if(q.get('o'))PG='orders';try{history.replaceState({p:PG,id:SID},'')}catch(e){}render();loadShops();if(PG=='orders'||ORD.length)trackAll();try{if('serviceWorker' in navigator&&/^http/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})();
</script>
</body></html>
